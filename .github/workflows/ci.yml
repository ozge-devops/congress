name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Labeling
        run: PYTHONPATH=src python tests/test_labeling.py
      - name: Paper numbers
        run: PYTHONPATH=src python tests/test_paper_consistency.py
      - name: VLM parse
        run: PYTHONPATH=src python tests/test_vlm_parse.py
      - name: API
        run: PYTHONPATH=src python tests/test_api.py
