<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VESTA API</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #161513;
      --muted: #5c574f;
      --line: #d9d1c4;
      --card: #fffcf7;
      --up: #0f6b3e;
      --down: #a61b1b;
      --silent: #6b6256;
      --accent: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 1.25rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 { margin: 0; font-size: 1.45rem; letter-spacing: -0.02em; }
    header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.95rem; }
    header a { color: var(--accent); }
    main {
      display: grid;
      grid-template-columns: minmax(240px, 320px) 1fr;
      gap: 1.25rem;
      padding: 1.25rem 1.5rem 2rem;
      max-width: 1120px;
    }
    form, .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0.65rem 0 0.2rem; }
    select, input, button {
      width: 100%;
      font: inherit;
      padding: 0.45rem 0.55rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    button {
      margin-top: 1rem;
      background: var(--ink);
      color: #fff;
      border: 0;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    .call {
      display: inline-block;
      padding: 0.15rem 0.55rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .call.up { background: #dcfce7; color: var(--up); }
    .call.down { background: #fee2e2; color: var(--down); }
    .call.silent { background: #ece7de; color: var(--silent); }
    .brief { white-space: pre-wrap; margin: 0.75rem 0 0; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
    }
    .chip {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.5rem;
      font-size: 0.8rem;
    }
    .chip b { display: block; font-size: 0.72rem; color: var(--muted); font-weight: 500; }
    img.chart {
      width: 100%;
      max-width: 420px;
      border-radius: 8px;
      border: 1px solid var(--line);
      margin-top: 0.75rem;
      background: #fff;
    }
    .err {
      color: var(--down);
      background: #fff1f1;
      border: 1px solid #f0c4c4;
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
    }
    .empty { color: var(--muted); }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; padding: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>VESTA brifing konsolu</h1>
    <p>
      BIST100 yön tahmini, T1 / T3 / T10 bütçesi, VisualClaw grafiği.
      Ham JSON için <a href="/docs">OpenAPI</a>.
    </p>
  </header>
  <main>
    <form id="form">
      <label for="date">Tarih (XU100 seans)</label>
      <select id="date" required></select>
      <label for="ticker">Hisse</label>
      <select id="ticker"></select>
      <label for="tier">Zaman bütçesi</label>
      <select id="tier">
        <option value="T1">T1 - 1 dk flash (sessiz kalabilir)</option>
        <option value="T3" selected>T3 - 3 dk bağlam</option>
        <option value="T10">T10 - 10 dk brifing</option>
      </select>
      <label for="mixer">Karıştırıcı</label>
      <select id="mixer">
        <option value="gated" selected>scalar gate</option>
        <option value="gmu">GMU</option>
        <option value="tfn">TFN</option>
        <option value="mean">mean</option>
        <option value="concat">concat</option>
        <option value="mult">1-layer attn (not MulT)</option>
        <option value="vision">vision-only</option>
        <option value="text">text-only</option>
        <option value="tabular">tabular OHLCV</option>
      </select>
      <button type="submit" id="go">Brifing al</button>
      <p class="meta" id="status">Motor yükleniyor…</p>
    </form>
    <section class="panel" id="out">
      <p class="empty">Bir seans seçin. T1 kapı kararsızsa sistem susar; T3 ve T10 her zaman konuşur.</p>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const out = $("out");
    const status = $("status");

    function showError(msg) {
      out.innerHTML = `<div class="err">${msg}</div>`;
    }

    async function boot() {
      const health = await fetch("/health").then((r) => r.json());
      if (!health.ready) {
        status.textContent = "Motor hazır değil: " + (health.error || "bekleniyor");
        showError("API henüz XU100 serisini yüklemedi. Birkaç saniye sonra yenileyin.");
        return;
      }
      const meta = await fetch("/v1/meta").then((r) => r.json());
      const dates = await fetch("/v1/dates?split=test").then((r) => r.json());
      const dateSel = $("date");
      dateSel.innerHTML = dates.dates.map((d) => `<option>${d}</option>`).join("");
      if (dates.dates.includes("2025-05-27")) dateSel.value = "2025-05-27";
      $("ticker").innerHTML = meta.tickers.map((t) => `<option>${t}</option>`).join("");
      status.textContent = `${meta.index.n_test} test günü · ${meta.index.test_start} - ${meta.index.test_end}`;
    }

    $("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      $("go").disabled = true;
      out.innerHTML = `<p class="empty">Karıştırıcı çalışıyor…</p>`;
      const q = new URLSearchParams({
        date: $("date").value,
        ticker: $("ticker").value,
        tier: $("tier").value,
        mixer: $("mixer").value,
      });
      try {
        const r = await fetch("/v1/brief?" + q);
        const data = await r.json();
        if (!r.ok) {
          showError(data.detail || data.error || r.statusText);
          return;
        }
        const cls = data.silent ? "silent" : data.call;
        const label = data.silent ? "sessiz" : (data.call === "up" ? "yukarı" : "aşağı");
        const chips = Object.entries(data.mixers)
          .map(([k, v]) => `<div class="chip"><b>${k}</b>${v.call} · ${(v.p_up * 100).toFixed(1)}%</div>`)
          .join("");
        const tokens = (data.tokens || []).map((t) => `<div class="chip">${t}</div>`).join("");
        const kap = data.event
          ? `<p class="meta">KAP: ${data.event.kap_polarity || "yok"} · ${data.event.kap_subjects || "bildirim yok"}</p>`
          : `<p class="meta">Endeks brifingi (hisse satırı yok).</p>`;
        out.innerHTML = `
          <p>
            <span class="call ${cls}">${label}</span>
            <span class="meta"> ${data.date} · ${data.ticker} · ${data.tier} ${data.tier_label} · ${data.mixer}</span>
          </p>
          <p class="meta">${data.reason}. Çağrı XU100 karıştırıcısı; metin ${data.brief_scope === "event_row" ? "hisse satırı" : "endeks örneği"}. Kapı g=${data.gate_g} (${data.gate_keeps}). Grafik: ${data.chart_signal}. Polarite: ${data.text_polarity}.</p>
          ${data.brief ? `<p class="brief">${data.brief}</p>` : ""}
          ${kap}
          <img class="chart" alt="VisualClaw screenshot" src="/v1/vision?date=${encodeURIComponent(data.date)}&kind=screenshot" />
          <div class="grid">${chips}</div>
          <p class="meta">Teslim: ${data.delivery.n_delivered} token · IN_new ${(data.delivery.in_new * 100).toFixed(0)}%</p>
          <div class="grid">${tokens}</div>
        `;
      } catch (err) {
        showError(String(err));
      } finally {
        $("go").disabled = false;
      }
    });

    boot().catch((err) => {
      status.textContent = "API'ye bağlanılamadı";
      showError(String(err));
    });
  </script>
</body>
</html>
